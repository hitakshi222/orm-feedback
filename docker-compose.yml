services:
  db:
    image: postgres:16-alpine
    container_name: biyani_client_feedback
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-biyani_feedback}
      POSTGRES_USER: ${POSTGRES_USER:-biyani}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DB_URL: postgresql+psycopg://${POSTGRES_USER:-biyani}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-biyani_feedback}
      DB_BACKEND: ${DB_BACKEND:-postgresql}
      MYSQL_DB_URL: ${MYSQL_DB_URL:-}
      SQLSERVER_DB_URL: ${SQLSERVER_DB_URL:-}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in the root .env file}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      FRONTEND_ORIGINS: http://localhost:8080
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data:
